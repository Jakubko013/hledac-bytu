name: Crawl

on:
  workflow_dispatch:
  # Fallback if Netlify IPs get blocked by the portals; enable by uncommenting.
  # schedule:
  #   - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
